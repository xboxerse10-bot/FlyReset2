
name: Build FlyReset

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle executable
        run: chmod +x Flyreset/gradlew

      - name: Build mod
        working-directory: Flyreset
        run: ./gradlew build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlyReset-2.0-Fabric-26.3
          path: Flyreset/build/libs/flyreset-2.0.0.jar
